<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on" />
</head>

<body>
    <main class="main-container">
        <header class="input-container">
            <input class="city-input" placeholder="Search City">
            <button class="search-btn">
                <span class="Symbols">
                    <img src="mf.png" alt="" class="mf">
                    
                    </span>
                  </button>
        </header>
        <section class="weather-info" style="display: none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                        </span>
                    
                        <h4 class="country-txt">India</h4>
                </div>
                <h5 class="current-date-txt regular-txt">Sat, 26 April</h5>
            </div>
            <div class="weather-summary-container">
                <img src="images/allweather/clear-sky.png" alt="" class="weather-summary-image">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">31 °C</h1>
                    <h3 class="condition-txt regular-txt">Cloudy</h3> 
                </div>
                
            
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="Symbols">
                        <img src="drop.png" alt="" class="mf">
                        </span>
                        <div class="condition-item">
                            <h5 class="regular-txt">Humidity</h5>
                            <h5 class="humidity-value-txt">55%</h5>
                        </div>
                      
                </div>
                <div class="condition-item">
                    <span class="Symbols">
                        <img src="wind.png" alt="" class="mf">
                        </span>
                        <div class="condition-item">
                            <h5 class="regular-txt">Wind Speed</h5>
                            <h5 class="wind-value-txt">4 m/s</h5>
                        </div>

                </div>
            </div>

            <div class="forecast-items-container">
                <div class="forecast-item">
                    <h5 class="forecast-item-date">27 April</h5>
                    <img src="images/allweather/Drizzle.png" alt="" class="forecast-item-img">
                    <h5 class="forecast-item-temp">35 °C</h5>
                </div>

                <div class="forecast-items-container">
                    <div class="forecast-item">
                        <h5 class="forecast-item-date">28 April</h5>
                        <img src="images/allweather/Drizzle.png" alt="" class="forecast-item-img">
                        <h5 class="forecast-item-temp">37 °C</h5>
                    </div>

                    <div class="forecast-items-container">
                        <div class="forecast-item">
                            <h5 class="forecast-item-date">29 April</h5>
                            <img src="images/allweather/atm.png" alt="" class="forecast-item-img">
                            <h5 class="forecast-item-temp">37 °C</h5>
                        </div>

                        <div class="forecast-items-container">
                            <div class="forecast-item">
                                <h5 class="forecast-item-date">30 April</h5>
                                <img src="images/allweather/snow.png" alt="" class="forecast-item-img">
                                <h5 class="forecast-item-temp">33 °C</h5>
                            </div>

                            <div class="forecast-items-container">
                                <div class="forecast-item">
                                    <h5 class="forecast-item-date">1 May</h5>
                                    <img src="images/allweather/Drizzle.png" alt="" class="forecast-item-img">
                                    <h5 class="forecast-item-temp">33 °C</h5>
                                </div>
            </div>
        </section>
        <section class="search-city section-message">
            <img src="male.png" alt="" class="message-img">
            <div>
            <h1>Search City</h1>
            <h4 class="regular-txt">Know the Current Weather Conditions of your City</h4>
            </div>
        </section>
    

        <section class="not-found section-message" style="display:none">
            <img src="istockphoto-1184930628-612x612.png" alt="" class="message-img">
            <h1> Search City</h1>
            <h4 class="regular-txt">It Seems like you have entered wrong input</h4>
            </div>
        </section>
    </main>
       
                

  
</body>
</html>
